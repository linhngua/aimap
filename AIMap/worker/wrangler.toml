name = "aimap-worker"
main = "src/index.js"
compatibility_date = "2026-02-07"

[vars]
OPENAI_MODEL = "gpt-4.1-mini"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
